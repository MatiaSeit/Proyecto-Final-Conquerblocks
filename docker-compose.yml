services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: alliance_supply
      POSTGRES_USER: alliance_supply
      POSTGRES_PASSWORD: alliance_supply
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alliance_supply"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend: &backend
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db
      DB_NAME: alliance_supply
      DB_USER: alliance_supply
      DB_PASSWORD: alliance_supply
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    <<: *backend
    command: celery -A config worker -l info
    ports: []
    environment:
      <<: *backend-env

  celery-beat:
    <<: *backend
    command: celery -A config beat -l info
    ports: []
    environment:
      <<: *backend-env

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
