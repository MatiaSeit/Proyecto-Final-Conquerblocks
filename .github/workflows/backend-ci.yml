name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alliance_supply
          POSTGRES_USER: alliance_supply
          POSTGRES_PASSWORD: alliance_supply
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alliance_supply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_NAME: alliance_supply
          DB_USER: alliance_supply
          DB_PASSWORD: alliance_supply
        run: python manage.py migrate

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_NAME: alliance_supply
          DB_USER: alliance_supply
          DB_PASSWORD: alliance_supply
        run: python -m pytest -v
